server:
  port: ${PORT:8080}

spring:
  application:
    name: auditflow-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/auditflow_db}
    username: ${SPRING_DATASOURCE_USERNAME:auditflow_user}
    password: ${SPRING_DATASOURCE_PASSWORD:auditflow_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: false
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true

  devtools:
    restart:
      enabled: ${SPRING_DEVTOOLS_RESTART_ENABLED:true}

app:
  security:
    jwt:
      secret: ${JWT_SECRET:auditflow-dev-secret-key-minimum-32-characters-123456}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}

    cookie:
      name: ${COOKIE_NAME:access_token}
      secure: ${COOKIE_SECURE:false}
      same-site: ${COOKIE_SAME_SITE:Lax}
      max-age-seconds: ${COOKIE_MAX_AGE_SECONDS:86400}

    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    org.springframework.security: ${SPRING_SECURITY_LOG_LEVEL:INFO}
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG_LEVEL:DEBUG}