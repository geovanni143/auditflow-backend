server:
  port: 8080

spring:
  application:
    name: auditflow-backend

  datasource:
    url: jdbc:postgresql://localhost:15432/auditflow_db
    username: auditflow_user
    password: auditflow_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  devtools:
    restart:
      enabled: true

app:
  security:
    jwt:
      secret: ${JWT_SECRET:auditflow-dev-secret-key-minimum-32-characters-123456}
      expiration-ms: 86400000
    cookie:
      name: access_token
      secure: false
      same-site: Lax
      max-age-seconds: 86400
    cors:
      allowed-origins: http://localhost:3000

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG