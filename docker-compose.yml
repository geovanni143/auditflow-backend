services:
  postgres:
    image: postgres:16
    container_name: auditflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: auditflow_db
      POSTGRES_USER: auditflow_user
      POSTGRES_PASSWORD: auditflow_password
    ports:
      - "15432:5432"
    volumes:
      - auditflow_postgres_data:/var/lib/postgresql/data

volumes:
  auditflow_postgres_data:
